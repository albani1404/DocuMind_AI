services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: documind, POSTGRES_PASSWORD: documind, POSTGRES_DB: documind }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U documind"], interval: 5s, retries: 10 }
  backend:
    build: { context: ., dockerfile: docker/backend.Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://documind:documind@db:5432/documind
      UPLOAD_DIR: /srv/storage/uploads
      PROCESSED_DIR: /srv/storage/processed
      CHROMA_DIR: /srv/storage/chroma
    volumes: [./storage:/srv/storage, hf_cache:/root/.cache/huggingface]
    depends_on: { db: { condition: service_healthy } }
    ports: ["8000:8000"]
  frontend:
    build: { context: ., dockerfile: docker/frontend.Dockerfile }
    depends_on: [backend]
    ports: ["5173:80"]
volumes: { pgdata: {}, hf_cache: {} }
